<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>★ great success ★</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inconsolata:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --cream:#fdf8e7; --dark:#1a1500; --accent1:#c8960a; --accent2:#e8b93a; --accent3:#f5d97a; --muted:#9a8040; --border:#c9a830; --panel:#f5e9b0; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      background:var(--dark);
      color:var(--cream);
      font-family:'Inconsolata',monospace;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      text-align:center;
      padding:40px 20px;
      background-image:
        repeating-linear-gradient(-45deg,transparent,transparent 20px,rgba(200,150,10,0.05) 20px,rgba(200,150,10,0.05) 21px);
      position:relative;
      overflow:hidden;
    }

    /* floating particles */
    .particle {
      position:fixed;
      width:4px; height:4px;
      border-radius:50%;
      background:var(--accent1);
      opacity:0;
      animation:float var(--dur) var(--delay) ease-in-out infinite;
      top:var(--y); left:var(--x);
    }
    @keyframes float {
      0%{opacity:0;transform:translateY(0) scale(0.5)}
      50%{opacity:0.6}
      100%{opacity:0;transform:translateY(-120px) scale(1.2)}
    }

    .secret-wrap { position:relative; z-index:10; max-width:600px; }

    .secret-emoji { font-size:64px; display:block; margin-bottom:24px; animation:bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    .secret-title {
      font-family:'Syne',sans-serif;
      font-weight:800;
      font-size:clamp(2rem,6vw,3.5rem);
      letter-spacing:-0.03em;
      line-height:1;
      margin-bottom:12px;
      color:var(--accent3);
    }
    .secret-sub {
      font-size:13px;
      color:var(--muted);
      letter-spacing:0.1em;
      text-transform:uppercase;
      margin-bottom:40px;
    }

    .secret-box {
      border:1.5px solid var(--accent1);
      background:rgba(200,150,10,0.08);
      padding:28px 32px;
      margin-bottom:32px;
      box-shadow:4px 4px 0 var(--accent1);
      text-align:left;
    }
    .secret-box-title {
      font-family:'Syne',sans-serif;
      font-weight:700;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.2em;
      color:var(--accent3);
      margin-bottom:14px;
    }
    .secret-box p {
      font-size:14px;
      line-height:1.8;
      color:rgba(253,248,231,0.8);
      margin-bottom:12px;
    }
    .secret-box p:last-child { margin-bottom:0; }

    .blink { animation:blink 1s step-end infinite; }
    @keyframes blink { 50%{opacity:0} }

    .back-btn {
      display:inline-block;
      font-family:'Syne',sans-serif;
      font-weight:700;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.15em;
      color:var(--cream);
      text-decoration:none;
      border:1.5px solid var(--accent1);
      padding:8px 20px;
      transition:background 0.15s;
      margin-top:8px;
    }
    .back-btn:hover { background:var(--accent1); }

    .visitor-note {
      margin-top:32px;
      font-size:11px;
      color:rgba(255,255,255,0.2);
      letter-spacing:0.1em;
    }
    .visitor-count { color:var(--accent3); font-weight:700; }
  </style>
</head>
<body>

  <!-- floating particles -->
  <div class="particle" style="--x:10%;--y:80%;--dur:4s;--delay:0s"></div>
  <div class="particle" style="--x:25%;--y:70%;--dur:5s;--delay:1s;background:#f5d97a"></div>
  <div class="particle" style="--x:60%;--y:90%;--dur:3.5s;--delay:0.5s"></div>
  <div class="particle" style="--x:80%;--y:75%;--dur:6s;--delay:2s;background:#e8b93a"></div>
  <div class="particle" style="--x:45%;--y:85%;--dur:4.5s;--delay:1.5s"></div>
  <div class="particle" style="--x:90%;--y:60%;--dur:5.5s;--delay:0.8s;background:#f5d97a"></div>
  <div class="particle" style="--x:5%;--y:50%;--dur:3s;--delay:2.5s"></div>
  <div class="particle" style="--x:70%;--y:40%;--dur:7s;--delay:0.3s;background:#e8b93a"></div>

  <div class="secret-wrap">

    <span class="secret-emoji">🥛</span>

    <div class="secret-title">great success!</div>
    <div class="secret-sub">very nice <span class="blink">|</span></div>

    <div class="secret-box">
      <div class="secret-box-title">★ you have found the Borat page</div>
      <p>i like you. i like sex. it's nice.</p>
      <p>you typed the magic word and now you are here, in my country of website. the neighbours, they are not so lucky.</p>
      <p style="color:var(--accent3);font-style:italic">— my wife <3 —</p>
    </div>

    <a href="guestbook.html" class="back-btn" id="back-btn">← return to normal country</a>

    <div class="visitor-note">
      secret visitor #<span class="visitor-count" id="secret-count">?</span> &nbsp;·&nbsp; very nice
    </div>

  </div>

<script>
  // Set back button to return to where we came from
  const from = new URLSearchParams(window.location.search).get('from');
  if (from) document.getElementById('back-btn').href = from + '.html';

  // Secret visitor counter — live from Upstash
  async function updateSecretCount() {
    try {
      const res = await fetch('https://spotify-backend-lyart.vercel.app/api/visitors?page=borat');
      const data = await res.json();
      document.getElementById('secret-count').textContent = data.count || '?';
    } catch(e) {}
  }
  updateSecretCount();
</script>
</body>
</html>
